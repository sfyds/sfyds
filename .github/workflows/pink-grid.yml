name: pink grid
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/grid.py
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          LOGIN: ${{ github.repository_owner }}
      - name: push to output branch
        run: |
          cd dist
          git init -b output
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "update grid"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git output
